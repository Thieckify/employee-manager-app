<article class="carte">
  <div class="carte__tete">
    <app-avatar [nom]="employe().name" [image]="employe().image" [taille]="52" />
    <app-role-badge [role]="employe().role" />
  </div>

  <div class="carte__identite">
    <h3 class="carte__nom">{{ employe().name }}</h3>
    <p class="carte__fonction" [class.vide]="!employe().fonction">
      {{ employe().fonction || 'Fonction non renseignée' }}
    </p>
  </div>

  @if (employe().email) {
    <a class="carte__email" [href]="'mailto:' + employe().email">
      <app-icon name="mail" [size]="15" />
      <span>{{ employe().email }}</span>
    </a>
  } @else {
    <p class="carte__email vide">
      <app-icon name="mail" [size]="15" />
      <span>E-mail non renseigné</span>
    </p>
  }

  <div class="carte__actions">
    <a class="btn btn-secondary btn-sm" [routerLink]="['/edit', employe().id]">
      <app-icon name="pencil" [size]="14" />
      Modifier
    </a>
    <button
      type="button"
      class="btn btn-ghost-danger btn-sm btn-icon"
      title="Supprimer"
      [attr.aria-label]="'Supprimer ' + employe().name"
      (click)="supprimer.emit(employe())"
    >
      <app-icon name="trash" [size]="16" />
    </button>
  </div>
</article>
